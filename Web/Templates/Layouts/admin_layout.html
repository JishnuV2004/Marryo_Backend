<!DOCTYPE html>
<html>
<head>
    <title>Marryo Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-50">

<div class="flex">

    <!-- Sidebar -->
    <aside class="fixed inset-y-0 left-0 w-64 bg-white border-r border-slate-100">

        <div class="flex items-center justify-between h-20 px-6 border-b border-slate-100">
            <h1 class="text-2xl font-bold bg-gradient-to-r from-pink-500 to-rose-400 bg-clip-text text-transparent">
                Marryo Admin
            </h1>
        </div>

        <nav class="mt-6 px-4 space-y-1">

            <a href="/admin/dashboard"
               class="flex items-center space-x-3 px-4 py-3 rounded-xl
               {{if eq .Active "dashboard"}} bg-pink-50 text-pink-600{{else}}text-slate-500 hover:bg-slate-50{{end}}">
                <span class="font-medium">Dashboard</span>
            </a>

            <a href="/admin/users"
               class="flex items-center space-x-3 px-4 py-3 rounded-xl
               {{if eq .Active "users"}} bg-pink-50 text-pink-600{{else}}text-slate-500 hover:bg-slate-50{{end}}">
                <span class="font-medium">User Management</span>
            </a>

            <a href="/admin/matches"
               class="flex items-center space-x-3 px-4 py-3 rounded-xl
               {{if eq .Active "matches"}} bg-pink-50 text-pink-600{{else}}text-slate-500 hover:bg-slate-50{{end}}">
                <span class="font-medium">Matches</span>
            </a>

            <a href="/admin/settings"
               class="flex items-center space-x-3 px-4 py-3 rounded-xl
               {{if eq .Active "settings"}} bg-pink-50 text-pink-600{{else}}text-slate-500 hover:bg-slate-50{{end}}">
                <span class="font-medium">Settings</span>
            </a>

        </nav>

        <div class="absolute bottom-0 w-full p-4 border-t border-slate-100">
            <a href="/admin/logout"
               class="flex items-center px-4 py-3 w-full text-slate-500 hover:bg-pink-50 hover:text-pink-600 rounded-xl">
                Logout
            </a>
        </div>

    </aside>


    <!-- Main Area -->
    <div class="flex-1 ml-64">

        <!-- Navbar -->
        <nav class="h-20 bg-white border-b border-slate-100 px-6 flex items-center justify-between">
            <div>
                <h2 class="text-lg font-semibold text-slate-800">{{.PageTitle}}</h2>
            </div>

            <div class="flex items-center gap-4">
                <span class="text-sm text-slate-600 font-semibold">
                    {{.Email}}
                </span>
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-pink-500 to-rose-400 flex items-center justify-center text-white">
                    A
                </div>
            </div>
        </nav>

        <!-- Dynamic Content -->
        <div class="p-8">
            {{embed}}
        </div>

    </div>

</div>

</body>
</html>
