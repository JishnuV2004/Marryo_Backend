<h2 class="text-2xl font-bold mb-6">Dashboard Overview</h2>

<div class="grid grid-cols-3 gap-6">

    <div class="bg-white p-6 rounded-xl shadow">
        <h3 class="font-semibold text-gray-600">Total Users</h3>
        <p class="text-2xl font-bold text-pink-600 mt-2">{{.TotalUsers}}</p>
    </div>

    <div class="bg-white p-6 rounded-xl shadow">
        <h3 class="font-semibold text-gray-600">Active Matches</h3>
        <p class="text-2xl font-bold text-pink-600 mt-2">{{.TotalMatches}}</p>
    </div>

    <div class="bg-white p-6 rounded-xl shadow">
        <h3 class="font-semibold text-gray-600">Pending Reports</h3>
        <p class="text-2xl font-bold text-pink-600 mt-2">{{.TotalReports}}</p>
    </div>

</div>
